name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.25.1'
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build, dist check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Rebuild and verify committed dist/ is current
        run: scripts/verify-dist.sh

  go:
    name: Go (fmt, vet, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: Vendored modules are consistent
        run: go mod verify && go mod vendor && git diff --exit-code -- vendor go.mod go.sum
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race ./cmd/... ./internal/...
      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/offline-docs.exe ./cmd/offline-docs
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/offline-docs ./cmd/offline-docs

  e2e:
    name: End-to-end (index fixture site, go offline, browse)
    runs-on: ubuntu-latest
    needs: [frontend, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: scripts/build-go.sh
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/e2e/
          if-no-files-found: ignore

  package:
    name: Release packages (preview)
    runs-on: ubuntu-latest
    needs: [frontend, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build and verify packages
        run: scripts/package-release.sh "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages-preview
          path: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS.txt
